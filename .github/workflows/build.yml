name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install libtorrent PySide6 pyinstaller
      - run: python -m unittest discover -s tests -t .
      - run: python build.py
      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: tar -czf BitClient-linux.tar.gz -C dist BitClient
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/BitClient -DestinationPath BitClient-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BitClient-${{ runner.os }}
          path: |
            BitClient-linux.tar.gz
            BitClient-windows.zip
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            BitClient-linux.tar.gz
            BitClient-windows.zip
          generate_release_notes: true
