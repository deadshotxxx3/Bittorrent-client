name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install libtorrent PySide6 pyinstaller
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: BitClient-${{ matrix.os }}
          path: dist/BitClient
